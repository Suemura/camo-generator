# main への push（PR マージ）で本番デプロイ。
# マージコミットは PR 時点と差分が出うるので、デプロイ前に CI と同じ検証を再実行する。
# 必要な Secrets: CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID（権限は README「デプロイ」節を参照）
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# デプロイの途中キャンセルは避け、直列化のみ行う
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://camo-generator.suemura.app
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: refs/private が混入していないか (最終防壁)
        run: bash tools/check-private-refs.sh
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm # devDependencies の wrangler を使う
          command: deploy
